<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../assets/branding/Frame.png" />
    <title>Criar conta | Sudoku Master</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/pages/cadastro.css">
    <script src="../js/cadastro.js" defer></script>
</head>
<body class="pagina-auth">
    <main class="auth">
        <div class="auth-conteudo">
            <a class="auth-voltar" href="../../index.html">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao início
            </a>
            <div class="auth-card">
                <header class="auth-header">
                    <h1>Crie sua conta</h1>
                    <p>Cadastre-se grátis para começar a jogar</p>
                </header>
                <form class="auth-form" id="form-cadastro" novalidate>
                    <div class="campo">
                        <label for="nome">Nome de Usuário</label>
                        <div class="campo-input">
                            <input type="text" id="ipt_nome" name="nome" autocomplete="nome" required>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <div class="campo-input">
                            <i class="fa-regular fa-envelope campo-icone"></i>
                            <input type="email" id="ipt_email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="campo-input">
                            <i class="fa-solid fa-lock campo-icone"></i>
                            <input type="password" id="ipt_senha" oninput="mostrarRequisitos()" name="senha" placeholder="••••••••" autocomplete="new-password" required>
                            <button type="button" class="campo-olho" aria-label="Mostrar senha" onclick="alternarSenha(ipt_senha, olho_senha)">
                                <i id="olho_senha" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                        <ul class="requisitos">
                            <li id="req_tamanho"><span class="requisito-marca"></span>Pelo menos 8 caracteres</li>
                            <li id="req_letra"><span class="requisito-marca"></span>Pelo menos uma letra</li>
                            <li id="req_numero"><span class="requisito-marca"></span>Pelo menos um número</li>
                        </ul>
                    </div>
                    <div class="campo">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <div class="campo-input">
                            <i class="fa-solid fa-lock campo-icone"></i>
                            <input type="password" id="ipt_confirmar" name="confirmar-senha" placeholder="••••••••" autocomplete="new-password" required>
                            <button type="button" class="campo-olho" aria-label="Mostrar senha" onclick="alternarSenha(ipt_confirmar, olho_confirmar)">
                                <i id="olho_confirmar" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div id="div_mensagem" class="mensagem" role="alert"></div>
                    <button type="button" class="btn-submit" onclick="cadastrar()">Criar conta</button>
                </form>
                <p class="auth-rodape">Já tem uma conta? <a href="login.html">Entrar</a></p>
            </div>
        </div>
    </main>
</body>
</html>
<script>
    let temTamanho = false;
    let temLetra = false;
    let temNumero = false;

    function mostrarMensagem(texto, tipo){
        div_mensagem.innerHTML = texto;
        div_mensagem.className = "mensagem " + tipo;
    }

    function limparMensagem(){
        div_mensagem.innerHTML = "";
        div_mensagem.className = "mensagem";
    }

    function mostrarRequisitos(){
        let senha = ipt_senha.value;

        temTamanho = senha.length >= 8;
        temLetra = false;
        temNumero = false;

        for(let i = 0; i < senha.length; i++){
            let caractere = senha[i];

            if(caractere >= "0" && caractere <= "9"){
                temNumero = true;
            }
            if(caractere.toLowerCase() != caractere.toUpperCase()){
                temLetra = true;
            }
        }

        if(temTamanho) {req_tamanho.classList.add("ok");}else{req_tamanho.classList.remove("ok");}
        if(temLetra){req_letra.classList.add("ok");}else{req_letra.classList.remove("ok");}
        if(temNumero){req_numero.classList.add("ok");}else{req_numero.classList.remove("ok");}
    }

    function limparMarcas(){
        ipt_nome.classList.remove("invalido");
        ipt_email.classList.remove("invalido");
        ipt_senha.classList.remove("invalido");
        ipt_confirmar.classList.remove("invalido");
    }

    function cadastrar(){
        let nome = ipt_nome.value.trim();
        let email = ipt_email.value.trim();
        let senha = ipt_senha.value;
        let confirmar = ipt_confirmar.value;

        let erros = [];

        limparMarcas();
        mostrarRequisitos();

        if(nome.length < 3){
            erros.push("O usuário deve ter pelo menos 3 caracteres.");
            ipt_nome.classList.add("invalido");
        }
        if(email.indexOf("@") == -1 || email.indexOf(".") == -1){
            erros.push("E-mail inválido.");
            ipt_email.classList.add("invalido");
        }
        if(!temTamanho){
            erros.push("A senha deve ter pelo menos 8 caracteres.");
            ipt_senha.classList.add("invalido");
        }
        if(!temLetra){
            erros.push("A senha deve ter pelo menos uma letra.");
            ipt_senha.classList.add("invalido");
        }
        if(!temNumero){
            erros.push("A senha deve ter pelo menos um número.");
            ipt_senha.classList.add("invalido");
        }
        if(confirmar != senha){
            erros.push("As senhas não são iguais");
            ipt_confirmar.classList.add("invalido");
        }

        if(erros.length > 0 ){
            let msg = "";

            for(let i = 0; i < erros.length; i++){
                msg += `${erros[i]}<br>`;
            }

            mostrarMensagem(msg, "erro");
        }else{
            limparMensagem();

            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: nome,
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta){
                if(resposta.ok){
                    mostrarMensagem("Cadastro realizado! Redirecionando para o Login...", "sucesso");

                    setTimeout(function () {
                        window.location = "/src/pages/login.html";
                    }, 2000);
                }else{
                    resposta.text().then(function (texto){
                        mostrarMensagem(texto, "erro");

                        if(resposta.status == 409){
                            ipt_nome.classList.add("invalido");
                            ipt_email.classList.add("invalido");
                        }
                    });
                }
            });
        }
    }

    function alternarSenha(campo, icone){
        if(campo.type == "password") {
            campo.type = "text";
            icone.className = "fa-regular fa-eye-slash";
        }else{
            campo.type = "password";
            icone.className = "fa-regular fa-eye";
        }
    }
</script>
