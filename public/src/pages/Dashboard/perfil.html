<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../../assets/branding/Frame.png" />
    <title>Perfil | Sudoku Master</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/pages/dashboard/app.css">
    <link rel="stylesheet" href="../../css/pages/dashboard/sidebar.css">
    <link rel="stylesheet" href="../../css/pages/dashboard/perfil/perfil.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div>
                <a class="sidebar-logo" href="inicio.html">
                    <img src="../../../assets/branding/logo.png" alt="Sudoku Master">
                </a>

                <nav>
                    <ul class="menu">
                        <li><a class="menu-item" href="inicio.html"><i class="fa-solid fa-house"></i>Início</a></li>
                        <li><a class="menu-item" href="jogar.html" aria-current="page"><i class="fa-solid fa-gamepad"></i>Jogar</a></li>
                        <li><a class="menu-item" href="painel.html"><i class="fa-solid fa-table-cells-large"></i>Painel</a></li>
                        <li><a class="menu-item ativo" href="perfil.html"><i class="fa-solid fa-user"></i>Perfil</a></li>
                    </ul>
                </nav>
            </div>

            <div class="sidebar-usuario">
                <p class="usuario-nome" id="nomeUsuario"></p>
                <p class="usuario-email" id="emailUsuario"></p>
                <button type="button" class="btn-sair" onclick="sair()">
                    <i class="fa-solid fa-right-from-bracket"></i>Sair
                </button>
            </div>
        </aside>
        <main class="conteudo">
            <div class="pagina pagina-perfil">
                <header>
                    <span class="etiqueta">Perfil</span>
                    <h1 class="pagina-titulo">Meu perfil</h1>
                    <p class="pagina-subtitulo">Atualize o seu nome e veja os dados da sua conta</p>
                </header>
                <div class="perfil-lista">
                    <section class="card perfil-topo">
                        <span class="avatar" id="avatarPerfil"></span>
                        <div>
                            <h2 class="perfil-nome" id="perfilNome"></h2>
                            <p class="perfil-email">
                                <i class="fa-regular fa-envelope"></i>
                                <span id="perfilEmail"></span>
                            </p>
                        </div>
                    </section>
                    <section class="card perfil-secao">
                        <h2 class="secao-titulo">Nome de exibição</h2>
                        <p class="secao-descricao">É assim que você aparece na plataforma.</p>
                        <form onsubmit="salvarNome(); return false;">
                            <label class="campo-rotulo" for="iptNome">Nome de Perfil</label>
                            <input class="campo-input" type="text" id="iptNome" value="Einer" autocomplete="name">
                            <button type="submit" class="btn-salvar">Salvar</button>
                            <p class="perfil-msg" id="msgNome" role="status"></p>
                        </form>
                    </section>
                    <section class="card perfil-secao">
                        <h2 class="secao-titulo">Conta</h2>
                        <ul class="info-lista">
                            <li class="info-linha">
                                <span class="info-rotulo"><i class="fa-regular fa-envelope"></i>E-mail</span>
                                <span class="info-valor" id="contaEmail">einer@gmail.com</span>
                            </li>
                            <li class="info-linha">
                                <span class="info-rotulo"><i class="fa-regular fa-user"></i>Status de conta</span>
                                <span class="info-valor" id="contaStatus"></span>
                            </li>
                            <li class="info-linha">
                                <span class="info-rotulo"><i class="fa-regular fa-calendar"></i>Membro desde</span>
                                <span class="info-valor" id="contaDesde"></span>
                            </li>
                        </ul> 
                    </section>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
<script>
    function validarSessao(){
        let idUsuario = sessionStorage.ID_USUARIO;
        let nomeUsuario = sessionStorage.NOME_USUARIO;
        let emailUsuario = sessionStorage.EMAIL_USUARIO;
        let ativoUsuario = sessionStorage.ATIVO;
        let dtCriacao = sessionStorage.DT_CRIACAO;

        if (idUsuario == undefined) {
            window.location = "../login.html";
            return;
        }

        if (document.getElementById("nomeUsuario")) {
            document.getElementById("nomeUsuario").innerHTML = nomeUsuario;
        }
        if (document.getElementById("emailUsuario")) {
            document.getElementById("emailUsuario").innerHTML = emailUsuario;
        }
        if (document.getElementById("perfilNome")) {
            document.getElementById("perfilNome").innerHTML = nomeUsuario;
        }
        if (document.getElementById("perfilEmail")) {
            document.getElementById("perfilEmail").innerHTML = emailUsuario;
        }
        if (document.getElementById("contaEmail")) {
            document.getElementById("contaEmail").innerHTML = emailUsuario;
        }
        if (document.getElementById("iptNome")) {
            document.getElementById("iptNome").value = nomeUsuario;
        }
        if (document.getElementById("avatarPerfil")) {
            if(nomeUsuario){
                document.getElementById("avatarPerfil").innerHTML = nomeUsuario.charAt(0).toUpperCase();
            }
        }

        if(document.getElementById("contaStatus")){
            if(ativoUsuario == 1){
                document.getElementById("contaStatus").innerHTML = "Ativo";
            }else{
                document.getElementById("contaStatus").innerHTML = "Inativo";
            }
        }

        if (document.getElementById("contaDesde")) {
            if (dtCriacao !== undefined && dtCriacao !== null && dtCriacao !== "") {
                let dataObj = new Date(dtCriacao);
                let dia = dataObj.getDate();
                let ano = dataObj.getFullYear();
                let mesNome = dataObj.toLocaleString('pt-BR', { month: 'long' });

                document.getElementById("contaDesde").innerHTML = dia + " de " + mesNome + " de " + ano;
            } else {
                document.getElementById("contaDesde").innerHTML = "Data indisponível";
            }
        }
    }

    function salvarNome(){
        let idUsuario = sessionStorage.ID_USUARIO;
        let novoNome = document.getElementById("iptNome").value.trim();
        let msgNome = document.getElementById("msgNome");

        if(novoNome === ""){
            msgNome.innerHTML = "O nome não pode ficar em branco.";
            msgNome.className = "perfil-msg erro";
            return;
        }

        fetch(`/usuarios/atualizar/${idUsuario}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeServer: novoNome
            })
        })
        .then(function (resposta){
            if(resposta.ok){
                sessionStorage.NOME_USUARIO = novoNome;

                msgNome.innerHTML = "Nome atualizado com sucesso!";
                msgNome.className = "perfil-msg sucesso";

                document.getElementById("perfilNome").innerHTML = novoNome;
                document.getElementById("nomeUsuario").innerHTML = novoNome;

                setTimeout(function (){
                    msgNome.innerHTML = "";
                }, 3000);
            }else{
                msgNome.innerHTML = "Erro ao atualizar o nome.";
                msgNome.className = "perfil-msg erro";
            }
        })
        .catch(function (erro){
            console.error("Erro na requisição:", erro);
            msgNome.innerHTML = "Erro de conexão com o servidor.";
            msgNome.className = "perfil-msg erro";
        });
    }

    validarSessao();

    function sair() {
        sessionStorage.clear();
        window.location = "/index.html";
    }
</script>
