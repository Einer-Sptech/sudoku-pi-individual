<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../assets/branding/Frame.png" />
    <title>Entrar | Sudoku Master</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body class="pagina-auth">
    <main class="auth">
        <div class="auth-conteudo">
            <a class="auth-voltar" href="../../index.html">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao início
            </a>
            <div class="auth-card">
                <header class="auth-header">
                    <h1>Bem-vindo de volta</h1>
                    <p>Entre na sua conta para jogar</p>
                </header>
                <form class="auth-form" id="form-login" novalidate>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <div class="campo-input">
                            <i class="fa-regular fa-envelope campo-icone"></i>
                            <input type="email" id="ipt_email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="campo-input">
                            <i class="fa-solid fa-lock campo-icone"></i>
                            <input type="password" id="ipt_senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" class="campo-olho" aria-label="Mostrar senha" onclick="alternarSenha(ipt_senha, olho_senha)">
                                <i id="olho_senha" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div id="div_mensagem" class="mensagem" role="alert"></div>
                    <button type="button" class="btn-submit" onclick="entrar()">Entrar</button>
                </form>
                <p class="auth-rodape">Não tem uma conta? <a href="./cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>
</body>
</html>
<script>
    function mostrarMensagem(texto, tipo){
        div_mensagem.innerHTML = texto;
        div_mensagem.className = "mensagem " + tipo;
    }

    function limparMensagem(){
        div_mensagem.innerHTML = "";
        div_mensagem.className = "mensagem";
    }

    function entrar(){
        let email = ipt_email.value.trim();
        let senha = ipt_senha.value;

        if(email == '' || senha == ''){
            mostrarMensagem("Preencha o e-mail e a senha.", "erro");
        }else{
            limparMensagem();

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta){
                if(resposta.ok){
                    resposta.json().then(function (json){
                        sessionStorage.ID_USUARIO = json.id;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.EMAIL_USUARIO = json.email;
                        mostrarMensagem("Login realizado! Entrando...", "sucesso");

                        setTimeout(function(){
                            window.location = "/src/pages/inicio.html";
                        }, 2000);
                    });
                }else{
                    resposta.text().then(function (texto){
                        mostrarMensagem(texto, "erro");
                    })
                }
            })
        }
    }

    function alternarSenha(campo, icone){
        if(campo.type == "password") {
            campo.type = "text";
            icone.className = "fa-regular fa-eye-slash";
        }else{
            campo.type = "password";
            icone.className = "fa-regular fa-eye";
        }
    }
</script>
